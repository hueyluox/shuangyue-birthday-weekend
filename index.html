const form=document.getElementById('unlock-form'),input=document.getElementById('trip-password'),button=document.getElementById('unlock-button'),status=document.getElementById('status'),show=document.getElementById('show-password');
const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
show.addEventListener('click',()=>{const visible=input.type==='password';input.type=visible?'text':'password';show.textContent=visible?'隐藏':'显示';show.setAttribute('aria-label',visible?'隐藏密码':'显示密码');show.setAttribute('aria-pressed',String(visible));});
form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;if(!window.crypto?.subtle){status.textContent='请用支持 HTTPS 的新版浏览器打开此页面。';return;}button.disabled=true;button.textContent='正在打开…';status.textContent='';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);const content=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv),tagLength:128},key,bytes(payload.data));input.value='';document.open();document.write(new TextDecoder().decode(content));document.close();}catch(error){status.textContent=error.name==='OperationError'?'密码不对，再试一次。':'暂时未能打开，请刷新后重试。';input.setAttribute('aria-invalid','true');input.focus();input.select();button.disabled=false;button.textContent='打开行程 →';}});
input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');status.textContent='';});
})();</script></body></html>
